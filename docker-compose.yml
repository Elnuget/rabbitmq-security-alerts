services:
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: rabbitmq-security-alerts
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5

  rabbitmq-setup:
    image: rabbitmq:3.12-management
    container_name: rabbitmq-setup
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./rabbitmq-init/init.sh:/init.sh:ro
    entrypoint: ["/bin/bash", "/init.sh"]

  producer-service:
    build: ./services/producer-service
    container_name: producer-service
    depends_on:
      rabbitmq-setup:
        condition: service_completed_successfully
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_VHOST: security_alerts

  consumer-soc-service:
    build: ./services/consumer-soc-service
    container_name: consumer-soc-service
    ports:
      - "8000:8000"
    depends_on:
      rabbitmq-setup:
        condition: service_completed_successfully
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_VHOST: security_alerts
    volumes:
      - soc_data:/data

  consumer-notifications-service:
    build: ./services/consumer-notifications-service
    container_name: consumer-notifications-service
    depends_on:
      rabbitmq-setup:
        condition: service_completed_successfully
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_VHOST: security_alerts
    volumes:
      - notifications_data:/data

volumes:
  rabbitmq_data:
  soc_data:
  notifications_data:
